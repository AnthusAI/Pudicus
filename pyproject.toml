[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leftblock"
version = "0.3.3"
description = "LeftBlock: a pluggable inspection gate for Git commits"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "PyYAML",
    "behave",
]

[tool.setuptools]
packages = ["leftblock"]

[tool.setuptools.package-data]
leftblock = ["data/*.toml"]

[project.scripts]
leftblock = "leftblock.cli:main"

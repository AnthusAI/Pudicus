[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "pudicus"
version = "0.1.0"
description = "A pluggable inspection gate for Git commits"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "PyYAML",
]

[project.scripts]
pudicus = "pudicus.cli:main"

name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install pinned gitleaks
      run: |
        GITLEAKS_VERSION=8.30.1
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
        tar -xzf gitleaks.tgz gitleaks
        sudo install gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install behave

    - name: Run unit tests (installer, default config, shipped ruleset)
      run: |
        python -m unittest discover tests -v

    - name: Run Gherkin Behavior Specs
      run: |
        behave

  self-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install pinned gitleaks
      run: |
        GITLEAKS_VERSION=8.30.1
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
        tar -xzf gitleaks.tgz gitleaks
        sudo install gitleaks /usr/local/bin/gitleaks
        gitleaks version

    - name: Scan the LeftBlock tree with its own shipped ruleset
      # Scan the complete checkout. Current changelog summaries omit
      # personal metadata, so no changelog finding is allowlisted.
      run: |
        gitleaks dir . --config leftblock/data/gitleaks.toml --no-banner --redact

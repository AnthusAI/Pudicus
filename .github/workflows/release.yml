name: Release

# Every push to main is released by python-semantic-release: it derives the
# next version from conventional commits (fix: patch, feat: minor), updates
# pyproject.toml, CHANGELOG.md and the README pin, tags vX.Y.Z, creates the
# GitHub release and builds the distribution. PyPI publishing uses trusted
# publishing. Pushes with no releasable commits (chore:, docs:, ...) publish
# nothing. The release commit is merged back into develop.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: leftblock-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the built distribution is LeftBlock
        if: steps.release.outputs.released == 'true'
        run: |
          ls dist/
          ls dist/ | grep -qx "leftblock-${{ steps.release.outputs.version }}.tar.gz"

      - name: Publish LeftBlock to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload distribution to the GitHub release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Merge the release commit back into develop
        if: steps.release.outputs.released == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout -B develop origin/develop
          git merge --no-edit origin/main
          git push origin develop

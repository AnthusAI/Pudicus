name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed LeftBlock version to publish
        required: true
        default: "0.3.0"

permissions:
  contents: read

concurrency:
  group: leftblock-pypi-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify the reviewed distribution identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "leftblock", "Only LeftBlock may be published here"
          assert project["version"] == os.environ["RELEASE_VERSION"], "Version mismatch"
          PY

      - name: Build the reviewed distribution
        run: |
          python -m pip install build
          python -m build

      - name: Publish LeftBlock to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

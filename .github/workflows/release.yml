name: Release

# Every push to main is released by python-semantic-release: it derives the
# next version from conventional commits (fix: patch, feat: minor), updates
# pyproject.toml, CHANGELOG.md and the README pin, tags vX.Y.Z, creates the
# GitHub release and builds the distribution. PyPI publishing uses trusted
# publishing. Pushes with no releasable commits (chore:, docs:, ...) publish
# nothing. The release commit is merged back into develop.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: leftblock-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # A rerun after a failed publish finds the release already made, so
      # semantic-release reports released=false. The tag on HEAD says this
      # commit is a release; rebuild and publish it (skip-existing makes the
      # upload idempotent).
      - name: Find the release tag on this commit
        id: tag
        run: |
          tag="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Release tag on HEAD: ${tag:-none}"

      - uses: actions/setup-python@v5
        if: steps.tag.outputs.tag != '' && steps.release.outputs.released != 'true'
        with:
          python-version: "3.11"

      - name: Rebuild the tagged release
        if: steps.tag.outputs.tag != '' && steps.release.outputs.released != 'true'
        run: |
          python -m pip install build
          python -m build

      - name: Check the built distribution is LeftBlock
        if: steps.tag.outputs.tag != ''
        run: |
          ls dist/
          ls dist/ | grep -qx "leftblock-${{ steps.tag.outputs.version }}.tar.gz"

      - name: Publish LeftBlock to PyPI
        if: steps.tag.outputs.tag != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Upload distribution to the GitHub release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v9.21.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      - name: Merge the release commit back into develop
        if: steps.tag.outputs.tag != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout -B develop origin/develop
          git merge --no-edit origin/main
          git push origin develop
